<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="description" content="Faça login ou cadastre-se para acessar os catálogos digitais da J V S Representações." />
    <title>Área do Cliente | J V S Representações</title>
    <link rel="icon" type="image/svg+xml" href="assets/logo-jvs.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/styles.css" />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
    <script src="js/supabase-config.js" defer></script>
    <script src="js/supabase-client.js" defer></script>
    <script src="js/login.js" defer></script>
  </head>
  <body class="login-page">
    <main class="login-shell" aria-label="Área do Cliente">
      <section class="login-panel">
        <a class="login-logo" href="index.html" aria-label="Voltar para o início">
          <img src="assets/logo-jvs.svg" alt="J V S Representações" />
        </a>

        <div class="login-copy">
          <span class="section-tag">Área do Cliente</span>
          <h1>Acesse os catálogos digitais</h1>
          <p>
            Entre com seu e-mail e senha ou crie seu cadastro para acessar os materiais comerciais.
          </p>
        </div>

        <div class="login-tabs" role="tablist" aria-label="Acesso do cliente">
          <button class="login-tab is-active" type="button" data-login-tab="login">Entrar</button>
          <button class="login-tab" type="button" data-login-tab="register">Cadastrar</button>
        </div>

        <p class="login-message" data-login-message hidden></p>

        <form class="login-form" data-login-form>
          <label class="login-field">
            <span>E-mail</span>
            <input type="email" name="email" placeholder="seuemail@empresa.com" autocomplete="email" required />
          </label>

          <label class="login-field">
            <span>Senha</span>
            <span class="password-control">
              <input type="password" name="password" placeholder="Digite sua senha" autocomplete="current-password" required />
              <button type="button" data-password-toggle aria-label="Mostrar senha">
                <span class="sr-only">Mostrar senha</span>
              </button>
            </span>
          </label>

          <button class="login-button" type="submit">Entrar na área do cliente</button>
        </form>

        <form class="login-form" data-register-form hidden>
          <label class="login-field">
            <span>Nome</span>
            <input type="text" name="name" placeholder="Seu nome completo" autocomplete="name" required />
          </label>

          <label class="login-field">
            <span>Nome da empresa</span>
            <input type="text" name="company" placeholder="Empresa onde atua" autocomplete="organization" required />
          </label>

          <label class="login-field">
            <span>Telefone</span>
            <input type="tel" name="phone" placeholder="(93) 99999-9999" autocomplete="tel" required />
          </label>

          <label class="login-field">
            <span>E-mail</span>
            <input type="email" name="email" placeholder="seuemail@empresa.com" autocomplete="email" required />
          </label>

          <label class="login-field">
            <span>Senha</span>
            <span class="password-control">
              <input type="password" name="password" placeholder="Crie uma senha" autocomplete="new-password" required />
              <button type="button" data-password-toggle aria-label="Mostrar senha">
                <span class="sr-only">Mostrar senha</span>
              </button>
            </span>
          </label>

          <label class="login-field">
            <span>Confirmar senha</span>
            <span class="password-control">
              <input type="password" name="passwordConfirm" placeholder="Repita a senha" autocomplete="new-password" required />
              <button type="button" data-password-toggle aria-label="Mostrar senha">
                <span class="sr-only">Mostrar senha</span>
              </button>
            </span>
          </label>

          <button class="login-button" type="submit">Criar cadastro</button>
        </form>
      </section>
    </main>
  </body>
</html>
