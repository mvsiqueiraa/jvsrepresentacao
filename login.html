<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Área do Cliente | J V S Representações</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body class="login-page">
    <main class="login-shell" aria-label="Área do Cliente">
      <section class="login-panel">
        <a class="login-logo" href="index.html" aria-label="Voltar para o início">
          <img src="assets/logo-jvs.svg" alt="J V S Representações" />
        </a>

        <div class="login-copy">
          <span class="section-tag">Área do Cliente</span>
          <h1>Acesse os catálogos digitais</h1>
          <p>
            Entre com seu e-mail e senha para consultar os materiais comerciais das marcas representadas.
          </p>
        </div>

        <form class="login-form" data-login-form>
          <label class="login-field">
            <span>E-mail</span>
            <input type="email" name="email" placeholder="seuemail@empresa.com" autocomplete="email" required />
          </label>

          <label class="login-field">
            <span>Senha</span>
            <input type="password" name="password" placeholder="Digite sua senha" autocomplete="current-password" required />
          </label>

          <button class="login-button" type="submit">Entrar na área do cliente</button>
        </form>

        <p class="login-note">Acesso demonstrativo para visualização dos catálogos.</p>
      </section>
    </main>

    <script src="js/login.js"></script>
  </body>
</html>
